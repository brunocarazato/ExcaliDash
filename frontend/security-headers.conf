# Shared security headers.
#
# nginx resets `add_header` inheritance as soon as a child context (server or
# location) declares its own `add_header`. Any location that needs a custom
# header must therefore include this file as well, otherwise the HTML shell and
# static assets would be served without CSP/X-Frame-Options.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; worker-src 'self' blob: data:;" always;
